name: Build Windows Application

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller DataValidationHub.spec --clean --noconfirm

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/DataValidationHub/*" `
            -DestinationPath "DataValidationHub-Windows.zip"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DataValidationHub-Windows
          path: DataValidationHub-Windows.zip
