name: Build Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build/requirements-build.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean build/DataValidationHub.spec

      - name: Zip application
        shell: pwsh
        run: Compress-Archive -Path dist/DataValidationHub -DestinationPath DataValidationHub-Windows.zip

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: DataValidationHub-Windows
          path: DataValidationHub-Windows.zip

      - name: Create release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DataValidationHub-Windows.zip
